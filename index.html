<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Custom Alphabet</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="alphabet">
      <!-- A -->
      <div class="letter A">
        <div class="solid a-left"></div>
        <div class="solid a-right"></div>
        <div class="solid a-top"></div>
        <div class="stripe a-middle"></div>
        <div class="solid a-mask"></div>
      </div>

      <!-- B -->
      <div class="letter B">
        <div class="stripe b-left"></div>

        <div class="solid b-top"></div>
        <div class="stripe b-upper-right"></div>

        <div class="solid b-middle"></div>

        <div class="stripe b-lower-right"></div>
        <div class="solid b-bottom"></div>
      </div>

      <!-- C -->
      <div class="letter C">
        <div class="solid c-top"></div>
        <div class="stripe c-left"></div>
        <div class="solid c-bottom"></div>
      </div>

      <!-- D -->
      <div class="letter D">
        <div class="stripe d-left"></div>
        <div class="solid d-top"></div>
        <div class="solid d-bottom"></div>
        <div class="solid d-right"></div>
      </div>

      <!-- E -->
      <div class="letter E">
        <div class="stripe e-left"></div>
        <div class="solid e-top"></div>
        <div class="solid e-middle"></div>
        <div class="solid e-bottom"></div>
      </div>

      <!-- F -->
      <div class="letter F">
        <div class="stripe f-left"></div>
        <div class="solid f-top"></div>
        <div class="solid f-middle"></div>
      </div>

      <!-- G -->
      <div class="letter G">
        <div class="solid g-top"></div>
        <div class="stripe g-left"></div>
        <div class="solid g-bottom"></div>
        <div class="solid g-right"></div>
        <div class="stripe g-middle"></div>
      </div>

      <!-- H -->
      <div class="letter H">
        <div class="stripe h-left"></div>
        <div class="solid h-middle"></div>
        <div class="solid h-right"></div>
      </div>

      <!-- I -->
      <div class="letter I">
        <div class="solid i-top"></div>
        <div class="stripe i-middle"></div>
        <div class="solid i-bottom"></div>
      </div>

      <!-- J -->
      <div class="letter J">
        <div class="solid j-top"></div>
        <div class="solid j-right"></div>
        <div class="stripe j-bottom"></div>
        <div class="solid j-left"></div>
      </div>

      <!-- K -->
      <div class="letter K">
        <div class="stripe k-left"></div>
        <div class="solid k-top"></div>
        <div class="solid k-bottom"></div>
      </div>

      <!-- L -->
      <div class="letter L">
        <div class="stripe l-left"></div>
        <div class="solid l-bottom"></div>
      </div>

      <!-- M -->
      <div class="letter M">
        <div class="stripe m-left"></div>
        <div class="solid m-left-diagonal"></div>
        <div class="solid m-right-diagonal"></div>
        <div class="solid m-right"></div>
      </div>

      <!-- N -->
      <div class="letter N">
        <div class="stripe n-left"></div>
        <div class="solid n-diagonal"></div>
        <div class="solid n-right"></div>
      </div>

      <!-- O -->
      <div class="letter O">
        <div class="solid o-top"></div>
        <div class="stripe o-left"></div>
        <div class="solid o-right"></div>
        <div class="solid o-bottom"></div>
      </div>

      <!-- P -->
      <div class="letter P">
        <div class="stripe p-left"></div>
        <div class="solid p-top"></div>
        <div class="solid p-middle"></div>
        <div class="solid p-right"></div>
      </div>

      <!-- Q -->
      <div class="letter Q">
        <div class="solid q-top"></div>
        <div class="stripe q-left"></div>
        <div class="solid q-right"></div>
        <div class="solid q-bottom"></div>
        <div class="solid q-tail"></div>
      </div>

      <!-- R -->
      <div class="letter R">
        <div class="stripe r-left"></div>
        <div class="solid r-top"></div>
        <div class="solid r-middle"></div>
        <div class="solid r-right"></div>
        <div class="solid r-leg"></div>
      </div>

      <!-- S -->
      <div class="letter S">
        <div class="solid s-top"></div>
        <div class="stripe s-left"></div>
        <div class="solid s-middle"></div>
        <div class="stripe s-right"></div>
        <div class="solid s-bottom"></div>
      </div>

      <!-- T -->
      <div class="letter T">
        <div class="solid t-top"></div>
        <div class="stripe t-middle"></div>
      </div>

      <!-- U -->
      <div class="letter U">
        <div class="solid u-left"></div>
        <div class="solid u-right"></div>
        <div class="stripe u-bottom"></div>
      </div>

      <!-- V -->
      <div class="letter V">
        <div class="solid v-left"></div>
        <div class="stripe v-middle"></div>
        <div class="solid v-right"></div>
        <div class="v-mask"></div>
      </div>
      <!-- W -->
      <div class="letter W">
        <div class="stripe w-left"></div>
        <div class="solid w-middle-left"></div>
        <div class="solid w-middle-right"></div>
        <div class="stripe w-right"></div>
      </div>

      <!-- X -->
      <div class="letter X">
        <div class="solid x-left"></div>
        <div class="stripe x-right"></div>
      </div>

      <div class="letter Y">
        <div class="solid y-left"></div>
        <div class="stripe y-right"></div>
        <div class="y-mask"></div>
      </div>

      <div class="letter Z">
        <div class="solid z-top"></div>
        <div class="stripe z-middle"></div>
        <div class="solid z-bottom"></div>
        <div class="z-mask"></div>
        <div class="z-mask-bottom"></div>
        <div class="z-mask-top-right"></div>
      </div>
    </main>
  </body>
</html>
